<title id="t">Fitted SABR parameters by expiry and tenor</title><desc id="d">Correlation rho and vol-of-vol nu of the fitted SABR cube at each grid node, by option expiry, one line per swap tenor, with the generating cube's values as a grey reference line. Open markers are nodes with no market quotes. Values in docs/vol_cube.csv.</desc>
