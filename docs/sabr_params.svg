<text x="64" y="30" font-size="16" font-weight="600" fill="#0b0b0b">Correlation ρ (rho) by option expiry</text>
<text x="64.0" y="51.0" font-size="13" fill="#52514e" text-anchor="start" style="font-variant-numeric: tabular-nums">Sets the skew: negative ρ means vol rises as strikes fall. The least well-pinned parameter, so the ±0.3bp quote noise shows up here.</text>
